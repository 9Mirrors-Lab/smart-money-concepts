<!DOCTYPE html>
<html>
<head>
  <style>
    * { box-sizing: border-box; }
    body { font-family: Inter, sans-serif; padding: 20px; background: #1c1c1e; color: #e0e0e0; margin: 0; }
    h2 { margin: 0 0 6px; font-size: 15px; font-weight: 600; }
    p { font-size: 12px; color: #888; margin: 0 0 16px; line-height: 1.5; }
    button {
      background: #18a0fb; color: #fff; border: none; border-radius: 6px;
      padding: 10px 0; font-size: 13px; cursor: pointer; width: 100%; font-weight: 500;
    }
    button:hover { background: #0d8de8; }
    button:disabled { background: #444; cursor: default; }
    #status { margin-top: 12px; font-size: 12px; color: #aaa; min-height: 18px; }
    #progress { margin-top: 8px; height: 4px; background: #333; border-radius: 2px; overflow: hidden; }
    #progress-bar { height: 100%; width: 0%; background: #18a0fb; transition: width 0.3s; border-radius: 2px; }
  </style>
</head>
<body>
  <h2>SMC Viewer — Build Components</h2>
  <p>Creates 6 fully editable Figma screens with Auto Layout frames, text layers, and styled components matching the SMC Viewer app design system.</p>
  <button id="run">Build All Screens</button>
  <div id="progress"><div id="progress-bar"></div></div>
  <div id="status"></div>
  <script>
    document.getElementById('run').onclick = function() {
      this.disabled = true;
      document.getElementById('status').textContent = 'Building…';
      parent.postMessage({ pluginMessage: { type: 'build' } }, '*');
    };
    window.onmessage = function(e) {
      const msg = e.data.pluginMessage;
      if (!msg) return;
      if (msg.type === 'progress') {
        document.getElementById('status').textContent = msg.text;
        document.getElementById('progress-bar').style.width = msg.pct + '%';
      } else if (msg.type === 'done') {
        document.getElementById('status').textContent = '✅ Done! All screens created.';
        document.getElementById('progress-bar').style.width = '100%';
        document.getElementById('run').disabled = false;
      } else if (msg.type === 'error') {
        document.getElementById('status').textContent = '❌ ' + msg.message;
        document.getElementById('run').disabled = false;
      }
    };
  </script>
</body>
</html>
