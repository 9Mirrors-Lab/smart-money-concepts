<!doctype html>
<html>
  <head>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        font-family:
          Inter,
          -apple-system,
          sans-serif;
        padding: 20px;
        background: #1c1c1e;
        color: #e0e0e0;
      }
      h2 {
        font-size: 15px;
        font-weight: 600;
        margin-bottom: 8px;
      }
      p {
        font-size: 12px;
        color: #888;
        line-height: 1.5;
        margin-bottom: 16px;
      }
      #build {
        width: 100%;
        padding: 10px;
        background: #18a0fb;
        color: #fff;
        border: none;
        border-radius: 6px;
        font-size: 13px;
        font-weight: 500;
        cursor: pointer;
      }
      #build:hover {
        background: #0d8de8;
      }
      #build:disabled {
        background: #444;
        cursor: default;
      }
      #status {
        margin-top: 12px;
        font-size: 12px;
        color: #aaa;
        min-height: 16px;
      }
      #bar {
        margin-top: 8px;
        height: 3px;
        background: #333;
        border-radius: 2px;
      }
      #fill {
        height: 100%;
        width: 0%;
        background: #18a0fb;
        border-radius: 2px;
        transition: width 0.3s;
      }
    </style>
  </head>
  <body>
    <h2>SMC Viewer — Build Components</h2>
    <p>
      Creates 6 fully editable screens (1440×900 Auto Layout) matching the SMC
      Viewer app design.
    </p>
    <button id="build">Build All Screens</button>
    <div id="bar"><div id="fill"></div></div>
    <div id="status"></div>
    <script>
      document.getElementById("build").onclick = function () {
        this.disabled = true;
        document.getElementById("status").textContent = "Starting…";
        parent.postMessage({ pluginMessage: { type: "build" } }, "*");
      };
      window.onmessage = function (e) {
        const msg = e.data.pluginMessage;
        if (!msg) return;
        if (msg.type === "progress") {
          document.getElementById("status").textContent = msg.text;
          document.getElementById("fill").style.width = msg.pct + "%";
        } else if (msg.type === "done") {
          document.getElementById("status").textContent =
            "✅ All screens created!";
          document.getElementById("fill").style.width = "100%";
          document.getElementById("build").disabled = false;
        } else if (msg.type === "error") {
          document.getElementById("status").textContent = "❌ " + msg.message;
          document.getElementById("build").disabled = false;
        }
      };
    </script>
  </body>
</html>
